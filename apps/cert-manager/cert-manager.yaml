---
# ClusterIssuer for Let's Encrypt production with Cloudflare DNS
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: edvard.lundin@pm.me
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
        selector:
          dnsNames:
            - "oisd.dev"
            - "*.oisd.dev"
            - "bos.oisd.dev"
            - "*.bos.oisd.dev"
            - "s3.oisd.dev"
            - "*.s3.oisd.dev"
            - "*.hypatia.oisd.dev"
            - "*.sarasate.oisd.dev"
            - "*.seneca.oisd.dev"

---
# ClusterIssuer for Let's Encrypt staging (for testing)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: edvard.lundin@pm.me
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
        selector:
          dnsNames:
            - "oisd.dev"
            - "*.oisd.dev"
            - "bos.oisd.dev"
            - "*.bos.oisd.dev"
            - "s3.oisd.dev"
            - "*.s3.oisd.dev"
            - "*.hypatia.oisd.dev"
            - "*.sarasate.oisd.dev"
            - "*.seneca.oisd.dev"
