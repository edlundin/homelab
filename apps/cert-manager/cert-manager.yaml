---
# Certificate for wildcard oisd.dev domain
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-oisd-io-cert
  namespace: traefik
spec:
  secretName: wildcard-tls-oisd
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "oisd.dev"
    - "*.oisd.dev"

---
