runtimeClassName: nvidia
failOnInitError: true
migStrategy: none
deviceListStrategy: envvar

nodeSelector:
  kubernetes.io/hostname: k3s-agent-2

tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
  - key: nvidia.com/gpu
    operator: Exists

affinity: null
nfd:
  enabled: false
gfd:
  enabled: false

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi
