apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: navidrome
  namespace: music
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: navidrome
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: slskd
  namespace: music
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: slskd
