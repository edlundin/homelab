---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: navidrome-data-v2
  namespace: music
  labels:
    app.kubernetes.io/name: navidrome
  annotations:
    homelab.oisd.dev/storage-basis: Live Navidrome data uses 121Mi; 2Gi leaves 1.8Gi usable headroom for the database and indexes.
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: slskd-config
  namespace: music
  labels:
    app.kubernetes.io/name: slskd
  annotations:
    homelab.oisd.dev/storage-basis: Existing music configuration uses 5-8Mi; 2Gi keeps downloads on NFS and leaves configuration and log headroom.
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: soulsync-data
  namespace: music
  labels:
    app.kubernetes.io/name: soulsync
  annotations:
    homelab.oisd.dev/storage-basis: SoulSync control data is measured at about 198Mi; 3Gi is a trial tripwire with about 2.8Gi headroom for the database and config.
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 3Gi
