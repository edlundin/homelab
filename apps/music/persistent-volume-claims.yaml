apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config
  namespace: music
  labels:
    app.kubernetes.io/name: qbittorrent
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: soularr-data
  namespace: music
  labels:
    app.kubernetes.io/name: soularr
  annotations:
    homelab.oisd.io/storage-basis: A 1.8Ki configuration and small denylist state need far less than 1Gi; 1Gi is the smallest Longhorn tripwire used for this workload.
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prowlarr-config
  namespace: music
  labels:
    app.kubernetes.io/name: prowlarr
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lidarr-config
  namespace: music
  labels:
    app.kubernetes.io/name: lidarr
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: navidrome-data
  namespace: music
  labels:
    app.kubernetes.io/name: navidrome
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: slskd-config
  namespace: music
  labels:
    app.kubernetes.io/name: slskd
  annotations:
    homelab.oisd.io/storage-basis: Existing music configuration uses 5-8Mi; 2Gi keeps downloads on NFS and leaves configuration and log headroom.
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: musicgrabber-data
  namespace: music
  labels:
    app.kubernetes.io/name: musicgrabber
  annotations:
    homelab.oisd.io/storage-basis: A new v4.0.2 SQLite database measured 4Ki; 1Gi is the smallest Longhorn tripwire used for this workload.
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
