apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: music
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: soulsync
  namespace: music
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: soulsync
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale-system
      ports:
        - protocol: TCP
          port: 8008
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: slskd
      ports:
        - protocol: TCP
          port: 5030
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: navidrome
      ports:
        - protocol: TCP
          port: 4533
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: navidrome
  namespace: music
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: navidrome
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: subwave
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: soulsync
      ports:
        - protocol: TCP
          port: 4533
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: slskd
  namespace: music
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: slskd
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale-system
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: soulsync
      ports:
        - protocol: TCP
          port: 5030
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - {}
