apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: music
  labels:
    app.kubernetes.io/name: navidrome
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: navidrome
  template:
    metadata:
      labels:
        app.kubernetes.io/name: navidrome
    spec:
      serviceAccountName: navidrome
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: navidrome
          image: deluan/navidrome:0.63.2@sha256:9012939114fbb1bb641b81cf96dec5ded15f0aafefe8d47a511d7cb919658e40
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4533
              protocol: TCP
          env:
            - name: ND_PORT
              value: "4533"
            - name: ND_SCANINTERVAL
              value: 1h
            - name: ND_MUSICFOLDER
              value: /nas/multimedia/Music
            - name: ND_DATAFOLDER
              value: /data
            - name: ND_ADDRESS
              value: 0.0.0.0
            - name: ND_LOGLEVEL
              value: info
            - name: TZ
              value: Europe/Paris
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: music
              mountPath: /nas
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: navidrome-data-v2
        - name: music
          nfs:
            server: 192.168.2.1
            path: /srv/nfs/raid
            readOnly: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slskd
  namespace: music
  labels:
    app.kubernetes.io/name: slskd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: slskd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slskd
      annotations:
        homelab.oisd.io/request-basis: Music pods measured at 1-3m CPU and 28-317Mi memory; 100m and 256Mi are initial scheduling requests for the first transfer test.
        homelab.oisd.io/limit-basis: One CPU and 1Gi memory are tripwires above the measured music workload; remeasure slskd after a completed transfer.
    spec:
      serviceAccountName: slskd
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: slskd
          image: slskd/slskd:0.25.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5030
              protocol: TCP
            - name: soulseek
              containerPort: 50300
              protocol: TCP
          env:
            - name: SLSKD_USERNAME
              valueFrom:
                secretKeyRef:
                  name: slskd-credentials
                  key: SLSKD_USERNAME
            - name: SLSKD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: slskd-credentials
                  key: SLSKD_PASSWORD
            - name: SLSKD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: slskd-credentials
                  key: SLSKD_API_KEY
            - name: SLSKD_JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: slskd-credentials
                  key: SLSKD_JWT_KEY
            - name: SLSKD_REMOTE_CONFIGURATION
              value: "true"
            - name: SLSKD_REMOTE_FILE_MANAGEMENT
              value: "false"
            - name: SLSKD_DOWNLOADS_DIR
              value: /nas/multimedia/Downloads/slskd/complete
            - name: SLSKD_INCOMPLETE_DIR
              value: /nas/multimedia/Downloads/slskd/incomplete
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /app
            - name: downloads
              mountPath: /nas/multimedia/Downloads/slskd
              subPath: multimedia/Downloads/slskd
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: slskd-config
        - name: downloads
          nfs:
            server: 192.168.2.1
            path: /srv/nfs/raid
            readOnly: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: soulsync
  namespace: music
  labels:
    app.kubernetes.io/name: soulsync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: soulsync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: soulsync
      annotations:
        homelab.oisd.io/non-root-basis: The upstream entrypoint detects UID 1000 and skips the root/gosu path.
        homelab.oisd.io/probe-basis: Upstream Compose start_period is 60s; the repository startup probe uses a 10s period, 5s timeout, and 30 failures.
        homelab.oisd.io/request-basis: These 500m CPU and 512Mi memory reservations mirror SoulSync upstream Compose bounds pending measurement.
        homelab.oisd.io/limit-basis: The 2000m CPU limit retains the upstream bound. The user-selected 5Gi memory tripwire follows an OOM kill at 2Gi and a measured 828Mi within two minutes of restart during concurrent downloads.
    spec:
      serviceAccountName: soulsync
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: soulsync
          image: boulderbadgedad/soulsync:3.2.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8008
              protocol: TCP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK
              value: "022"
            - name: TZ
              value: Europe/Paris
            - name: PYTHONPATH
              value: /app
            - name: SOULSYNC_CONFIG_PATH
              value: /app/data/config.json
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 5Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: nas
              mountPath: /app/downloads
              subPath: multimedia/Downloads/slskd/complete
            - name: nas
              mountPath: /app/Transfer
              subPath: multimedia/Music
            - name: atomic-staging
              mountPath: /app/.soulsync_atomic_staging
      volumes:
        - name: atomic-staging
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: soulsync-data
        - name: nas
          nfs:
            server: 192.168.2.1
            path: /srv/nfs/raid
            readOnly: false
