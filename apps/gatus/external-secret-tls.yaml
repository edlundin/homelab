apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: traefik-secret-store
  namespace: gatus
spec:
  provider:
    kubernetes:
      remoteNamespace: traefik
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: gatus-external-secrets-sa
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gatus-external-secrets-sa
  namespace: gatus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-traefik-gatus
  namespace: traefik
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [wildcard-tls-oisd]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gatus-read-traefik-tls-secrets
  namespace: traefik
subjects:
  - kind: ServiceAccount
    name: gatus-external-secrets-sa
    namespace: gatus
roleRef:
  kind: Role
  name: read-traefik-gatus
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wildcard-tls-oisd
  namespace: gatus
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: traefik-secret-store
    kind: SecretStore
  target:
    name: wildcard-tls-oisd
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: wildcard-tls-oisd
        property: tls.crt
    - secretKey: tls.key
      remoteRef:
        key: wildcard-tls-oisd
        property: tls.key
