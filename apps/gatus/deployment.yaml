apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  namespace: gatus
  labels:
    app.kubernetes.io/name: gatus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gatus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gatus
    spec:
      serviceAccountName: gatus-sidecar
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gatus
          image: ghcr.io/twin/gatus:v5.38.0
          env:
            - name: GATUS_CONFIG_PATH
              value: /etc/gatus
            # Gatus compares config mtimes at one-second resolution. Initial
            # discovery took ~100ms; allow two seconds to load its first write
            # at startup rather than miss a write in Gatus's startup second.
            - name: GATUS_DELAY_START_SECONDS
              value: "2"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: generated-config
              mountPath: /etc/gatus/generated
              readOnly: true
            # Mount the directory rather than subPath so ConfigMap updates reload.
            - name: base-config
              mountPath: /etc/gatus/base
              readOnly: true
            - name: data
              mountPath: /data
        - name: gatus-sidecar
          image: ghcr.io/home-operations/gatus-sidecar:0.6.0
          args:
            - --enable-service
            - --enable-ingress
            - --enable-ingressroute
            - --prefix-service=svc/
            - --prefix-ingress=ing/
            - --prefix-ingressroute=route/
          # Upstream exposes no health server or probe command. The distroless
          # image has no shell; Kubernetes restarts the process when it exits.
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: generated-config
              mountPath: /config
            # Only discovery gets API credentials, not the web/check container.
            - name: api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: generated-config
          emptyDir: {}
        - name: base-config
          configMap:
            name: gatus-config
        - name: data
          persistentVolumeClaim:
            claimName: gatus-data
        - name: api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
