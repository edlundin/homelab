apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gatus
  namespace: gatus
  annotations:
    gatus.home-operations.com/endpoint: |
      name: Gatus (HTTPS)
      group: Monitoring
      path: /health
      conditions:
        - "[STATUS] == 200"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`gatus.oisd.dev`)
      kind: Rule
      services:
        - name: gatus
          port: 8080
      middlewares:
        - name: default-chain
          namespace: traefik
  tls:
    secretName: wildcard-tls-oisd
