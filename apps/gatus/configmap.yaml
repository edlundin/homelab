apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: gatus
data:
  config.yaml: |
    storage:
      type: sqlite
      path: /data/gatus.db
    ui:
      title: Homelab Status
      header: Homelab
      dashboard-heading: Service status
      dashboard-subheading: Availability checks from inside the k3s cluster
      dark-mode: true
      default-sort-by: group
    # Gatus requires at least one endpoint, even before discovery has completed
    # or after the last opted-in resource is removed.
    endpoints:
      - name: Gatus
        group: Monitoring
        url: http://127.0.0.1:8080/health
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: AdGuard Home dashboard (Soteria)
        group: DNS
        url: https://soteria.ison-mirfak.ts.net:4043/login.html
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 168h"
      # DoH query (RFC 8484 wire format) for www.example.com A. Gatus DNS
      # endpoints only speak plain DNS, so DoH is probed over HTTP.
      - name: AdGuard Home DoH (Soteria)
        group: DNS
        url: https://soteria.ison-mirfak.ts.net:4043/dns-query?dns=AAABAAABAAAAAAAAA3d3dwdleGFtcGxlA2NvbQAAAQAB
        interval: 1m
        headers:
          Accept: application/dns-message
        conditions:
          - "[STATUS] == 200"
          - "len([BODY]) > 0"
      # TLS handshake only; Gatus cannot send DNS queries over DoT.
      - name: AdGuard Home DoT (Soteria)
        group: DNS
        url: tls://soteria.ison-mirfak.ts.net:853
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
          - "[CERTIFICATE_EXPIRATION] > 168h"
      - name: AdGuard Home dashboard (Peirce)
        group: DNS
        url: https://peirce.ison-mirfak.ts.net:4043/login.html
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 168h"
      # DoH query (RFC 8484 wire format) for www.example.com A. Gatus DNS
      # endpoints only speak plain DNS, so DoH is probed over HTTP.
      - name: AdGuard Home DoH (Peirce)
        group: DNS
        url: https://peirce.ison-mirfak.ts.net:4043/dns-query?dns=AAABAAABAAAAAAAAA3d3dwdleGFtcGxlA2NvbQAAAQAB
        interval: 1m
        headers:
          Accept: application/dns-message
        conditions:
          - "[STATUS] == 200"
          - "len([BODY]) > 0"
      # TLS handshake only; Gatus cannot send DNS queries over DoT.
      - name: AdGuard Home DoT (Peirce)
        group: DNS
        url: tls://peirce.ison-mirfak.ts.net:853
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
          - "[CERTIFICATE_EXPIRATION] > 168h"
      - name: AdGuard Home dashboard (Sarasate)
        group: DNS
        url: https://sarasate.ison-mirfak.ts.net:4043/login.html
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 168h"
      # DoH query (RFC 8484 wire format) for www.example.com A. Gatus DNS
      # endpoints only speak plain DNS, so DoH is probed over HTTP.
      - name: AdGuard Home DoH (Sarasate)
        group: DNS
        url: https://sarasate.ison-mirfak.ts.net:4043/dns-query?dns=AAABAAABAAAAAAAAA3d3dwdleGFtcGxlA2NvbQAAAQAB
        interval: 1m
        headers:
          Accept: application/dns-message
        conditions:
          - "[STATUS] == 200"
          - "len([BODY]) > 0"
      # TLS handshake only; Gatus cannot send DNS queries over DoT.
      - name: AdGuard Home DoT (Sarasate)
        group: DNS
        url: tls://sarasate.ison-mirfak.ts.net:853
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
          - "[CERTIFICATE_EXPIRATION] > 168h"
      # Public DoH through the OCI Network Load Balancer (docs/doh.md). Caddy
      # answers 404 to requests without an allow-listed ClientID, so a 404 with
      # a valid certificate proves the load balancer, the Cloudflare record, a
      # healthy backend's Caddy and the shared certificate. Backend AdGuard
      # health is covered by the per-host checks above.
      - name: Public DoH (doh.oisd.dev)
        group: DNS
        url: https://doh.oisd.dev/
        interval: 1m
        conditions:
          - "[STATUS] == 404"
          - "[CERTIFICATE_EXPIRATION] > 168h"
