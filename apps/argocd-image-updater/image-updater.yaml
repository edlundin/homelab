apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: homelab-services
  namespace: argocd
spec:
  writeBackConfig:
    method: git:secret:argocd/argocd-image-updater-github
    gitConfig:
      repository: https://github.com/edlundin/homelab.git
      branch: master
  applicationRefs:
    - namePattern: argocd-image-updater
      writeBackConfig:
        method: git:secret:argocd/argocd-image-updater-github
        gitConfig:
          writeBackTarget: helmvalues:/apps/argocd-image-updater/values.yaml
      images:
        - alias: argocd-image-updater
          imageName: quay.io/argoprojlabs/argocd-image-updater:v1.x
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag
    - namePattern: music
      writeBackConfig:
        method: git:secret:argocd/argocd-image-updater-github
        gitConfig:
          writeBackTarget: kustomization:/apps/music
      images:
        - alias: qbittorrent
          imageName: lscr.io/linuxserver/qbittorrent
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: regexp:^[0-9]+\.[0-9]+\.[0-9]+_v[0-9]+\.[0-9]+\.[0-9]+-ls[0-9]+$
          manifestTargets:
            kustomize:
              name: lscr.io/linuxserver/qbittorrent
        - alias: prowlarr
          imageName: lscr.io/linuxserver/prowlarr
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: regexp:^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+-ls[0-9]+$
          manifestTargets:
            kustomize:
              name: lscr.io/linuxserver/prowlarr
        - alias: flaresolverr
          imageName: ghcr.io/flaresolverr/flaresolverr:v3.x
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
          manifestTargets:
            kustomize:
              name: ghcr.io/flaresolverr/flaresolverr
        - alias: lidarr
          imageName: lscr.io/linuxserver/lidarr
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: regexp:^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+-ls[0-9]+$
          manifestTargets:
            kustomize:
              name: lscr.io/linuxserver/lidarr
        - alias: navidrome
          imageName: docker.io/deluan/navidrome:0.x
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: regexp:^[0-9]+\.[0-9]+\.[0-9]+$
          manifestTargets:
            kustomize:
              name: deluan/navidrome
        - alias: slskd
          imageName: docker.io/slskd/slskd:0.x
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: regexp:^0\.[0-9]+\.[0-9]+$
          manifestTargets:
            kustomize:
              name: slskd/slskd
        - alias: soularr
          imageName: ghcr.io/mrusse/soularr:1.x
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: regexp:^[0-9]+\.[0-9]+\.[0-9]+$
          manifestTargets:
            kustomize:
              name: mrusse/soularr
    - namePattern: digarr
      writeBackConfig:
        method: git:secret:argocd/argocd-image-updater-github
        gitConfig:
          writeBackTarget: kustomization:/apps/digarr/extra
      images:
        - alias: digarr
          imageName: ghcr.io/iuliandita/digarr
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: regexp:^[0-9]+\.[0-9]+\.[0-9]+-debian$
          manifestTargets:
            kustomize:
              name: ghcr.io/iuliandita/digarr
        - alias: postgres-bootstrap
          imageName: docker.io/library/postgres:17-alpine
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            kustomize:
              name: postgres
    - namePattern: subwave
      writeBackConfig:
        method: git:secret:argocd/argocd-image-updater-github
        gitConfig:
          writeBackTarget: kustomization:/apps/subwave
      images:
        - alias: busybox
          imageName: docker.io/library/busybox:1.x
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: regexp:^[0-9]+\.[0-9]+\.[0-9]+$
          manifestTargets:
            kustomize:
              name: busybox
        - alias: subwave-caddy
          imageName: ghcr.io/perminder-klair/subwave-caddy:1.x
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: regexp:^[0-9]+\.[0-9]+\.[0-9]+$
          manifestTargets:
            kustomize:
              name: ghcr.io/perminder-klair/subwave-caddy
        - alias: subwave-web
          imageName: ghcr.io/perminder-klair/subwave-web:1.x
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: regexp:^[0-9]+\.[0-9]+\.[0-9]+$
          manifestTargets:
            kustomize:
              name: ghcr.io/perminder-klair/subwave-web
        - alias: subwave-controller
          imageName: ghcr.io/perminder-klair/subwave-controller:1.x
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: regexp:^[0-9]+\.[0-9]+\.[0-9]+$
          manifestTargets:
            kustomize:
              name: ghcr.io/perminder-klair/subwave-controller
        - alias: subwave-broadcast
          imageName: ghcr.io/perminder-klair/subwave-broadcast:1.x
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: regexp:^[0-9]+\.[0-9]+\.[0-9]+$
          manifestTargets:
            kustomize:
              name: ghcr.io/perminder-klair/subwave-broadcast
        - alias: subwave-analyzer
          imageName: ghcr.io/perminder-klair/subwave-analyzer:1.x
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: regexp:^[0-9]+\.[0-9]+\.[0-9]+$
          manifestTargets:
            kustomize:
              name: ghcr.io/perminder-klair/subwave-analyzer
    - namePattern: n8n
      images:
        - alias: n8n
          imageName: n8nio/n8n:1.x
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: regexp:^[0-9]+\.[0-9]+\.[0-9]+$
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag
    - namePattern: qdrant
      writeBackConfig:
        method: git:secret:argocd/argocd-image-updater-github
        gitConfig:
          writeBackTarget: helmvalues:/apps/qdrant/values.yaml
      images:
        - alias: qdrant
          imageName: qdrant/qdrant:v1.x
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag
    - namePattern: pulse
      writeBackConfig:
        method: git:secret:argocd/argocd-image-updater-github
        gitConfig:
          writeBackTarget: kustomization:/apps/pulse
      images:
        - alias: pulse
          imageName: rcourtman/pulse:6.x
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: regexp:^[0-9]+\.[0-9]+\.[0-9]+$
          manifestTargets:
            kustomize:
              name: rcourtman/pulse
    - namePattern: searxng
      writeBackConfig:
        method: git:secret:argocd/argocd-image-updater-github
        gitConfig:
          writeBackTarget: helmvalues:/apps/searxng/values.yaml
      images:
        - alias: searxng
          imageName: docker.io/searxng/searxng:latest
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag
    - namePattern: tailscale-operator
      writeBackConfig:
        method: git:secret:argocd/argocd-image-updater-github
        gitConfig:
          writeBackTarget: helmvalues:/apps/tailscale-operator/values.yaml
      images:
        - alias: tailscale-operator
          imageName: tailscale/k8s-operator
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
          manifestTargets:
            helm:
              name: operatorConfig.image.repository
              tag: operatorConfig.image.tag
        - alias: tailscale-proxy
          imageName: tailscale/tailscale
          commonUpdateSettings:
            updateStrategy: semver
            forceUpdate: true
            allowTags: regexp:^v[0-9]+\.[0-9]+\.[0-9]+$
          manifestTargets:
            helm:
              name: proxyConfig.image.repository
              tag: proxyConfig.image.tag
