config:
  logLevel: info
image:
  repository: quay.io/argoprojlabs/argocd-image-updater
  tag: v1.4.0

# Check once a day instead of every 2m. The interval counts from controller start,
# not wall-clock time, so a pod restart shifts the daily check.
extraArgs:
  - --interval
  - 24h

# kubectl top measured 49Mi and 2m CPU; 64Mi and 10m cover the observed use.
resources:
  requests:
    cpu: 10m
    memory: 64Mi
