---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: digarr-db
  namespace: digarr
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  encryptedData:
    DATABASE_URL: 
    DIGARR_ENCRYPTION_KEY: 
  template:
    metadata:
      name: digarr-db
      namespace: digarr
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgres-digarr-credentials
  namespace: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  encryptedData:
    database: 
    password: 
    username: 
  template:
    metadata:
      name: postgres-digarr-credentials
      namespace: postgres
