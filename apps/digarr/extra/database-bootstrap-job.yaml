apiVersion: batch/v1
kind: Job
metadata:
  name: digarr-database-bootstrap
  namespace: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
  labels:
    app.kubernetes.io/name: digarr
    app.kubernetes.io/component: database-bootstrap
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: digarr
        app.kubernetes.io/component: database-bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: postgres:17-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - |
              PGOPTIONS="-c digarr.bootstrap_password=$DIGARR_PASSWORD" \
                psql -v ON_ERROR_STOP=1 --command="
                  DO \$\$
                  BEGIN
                    IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'digarr') THEN
                      EXECUTE format(
                        'ALTER ROLE digarr LOGIN PASSWORD %L',
                        current_setting('digarr.bootstrap_password')
                      );
                    ELSE
                      EXECUTE format(
                        'CREATE ROLE digarr LOGIN PASSWORD %L',
                        current_setting('digarr.bootstrap_password')
                      );
                    END IF;
                  END
                  \$\$;
                "
              if [ "$(psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'digarr'")" != "1" ]; then
                createdb --owner=digarr digarr
              else
                psql -v ON_ERROR_STOP=1 --command="ALTER DATABASE digarr OWNER TO digarr"
              fi
          env:
            - name: HOME
              value: /tmp
            - name: PGHOST
              value: postgres-postgresql.postgres.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: postgres
            - name: PGDATABASE
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-password
                  key: postgres-password
            - name: DIGARR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-digarr-credentials
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
