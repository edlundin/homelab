fullnameOverride: itsaplan

# The upstream images declare no USER and run as root. Restrict what root can do
# without changing the user, which the images do not support.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

serviceAccount:
  create: false
  name: itsaplan

api:
  env:
    # The api is served under /api on the web host (Traefik strips the prefix),
    # so one hostname and the existing wildcard certificate cover both.
    API_URL: https://plan.oisd.dev/api
    APP_URL: https://plan.oisd.dev
    S3_BUCKET: planner-attachments
    S3_REGION: us-east-1
    S3_FORCE_PATH_STYLE: "true"
    TELEMETRY_DISABLED: "1"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

web:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

worker:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Telegram linking is not used.
bot:
  enabled: false

# The shared PostgreSQL 18 service hosts the itsaplan database. The api image
# ships the PostgreSQL 18 client, so its pre-migration pg_dump matches the server.
postgresql:
  enabled: false
externalDatabase:
  # Placeholder required by the chart. The chart's Secret is removed in
  # kustomization.yaml; the real DATABASE_URL comes from itsaplan-secrets-sealed.yaml.
  url: postgres://unused

minio:
  enabled: true
  bucket: planner-attachments
  persistence:
    size: 5Gi
    storageClass: longhorn
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
