apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.longhorn.io
    # Track coordinated patch releases only. Minor upgrades require a staged
    # Longhorn engine migration and a fresh system backup.
    targetRevision: "1.12.*"
    chart: longhorn
    helm:
      values: |
        persistence:
          defaultClass: true
          defaultClassReplicaCount: 1
          reclaimPolicy: Retain

        defaultSettings:
          backupTarget: s3://homelab-backups@garage/
          backupTargetCredentialSecret: longhorn-backup-secret
          # Based on 10 healthy V1 volumes, each currently single-replica;
          # one engine upgrade per node limits concurrent exposure.
          concurrentAutomaticEngineUpgradePerNodeLimit: 1

        ingress:
          enabled: true
          ingressClassName: traefik
          host: longhorn.oisd.dev
          tls: true
          tlsSecret: wildcard-tls-oisd
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            traefik.ingress.kubernetes.io/router.middlewares: longhorn-system-longhorn-auth@kubernetescrd

        preUpgradeChecker:
          jobEnabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
