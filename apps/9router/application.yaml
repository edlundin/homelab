apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 9router
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/edlundin/homelab.git
    targetRevision: HEAD
    path: apps/9router
    directory:
      include: "{deployment.yaml,service.yaml,service-account.yaml,pvc.yaml,ingress.yaml,tailscale-ingress.yaml,external-secret-tls.yaml,network-policy.yaml,initial-password-sealed.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: 9router
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
