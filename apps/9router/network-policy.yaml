apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: 9router
  namespace: 9router
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: 9router
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: atuin
          podSelector:
            matchLabels:
              app.kubernetes.io/name: atuin
              app.kubernetes.io/component: ai-gateway
      ports:
        - protocol: TCP
          port: 20128
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: searxng
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: searxng
              app.kubernetes.io/name: searxng
              pod.name: main
      ports:
        - protocol: TCP
          port: 8080
    # Provider APIs and OAuth endpoints are configured in 9router's database.
    - ports:
        - protocol: TCP
          port: 443
