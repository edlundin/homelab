apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatterbox
  namespace: chatterbox
  labels:
    app.kubernetes.io/name: chatterbox
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: chatterbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chatterbox
    spec:
      serviceAccountName: chatterbox
      automountServiceAccountToken: false
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: k3s-agent-2
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chatterbox
          image: ghcr.io/devnen/chatterbox-tts-server:2.0.0@sha256:6450dd7fa095a03f5db4c6efa2f94829ecc7b6ea34c35ef309dae4d77d987371
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8004
              protocol: TCP
          env:
            - name: HF_HOME
              value: /app/hf_cache
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "1"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 8Gi
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /api/ui/initial-data
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/ui/initial-data
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/ui/initial-data
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: cache
              mountPath: /app/hf_cache
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: chatterbox-cache

