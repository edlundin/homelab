---
# Traefik Dashboard IngressRoute
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: traefik
  annotations:
    # Probe the Basic Auth boundary without storing dashboard credentials.
    gatus.home-operations.com/endpoint: |
      name: Traefik dashboard (authentication)
      group: Infrastructure
      conditions:
        - "[STATUS] == 401"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`proxy.oisd.dev`)
      kind: Rule
      services:
        - name: api@internal
          kind: TraefikService
      middlewares:
        - name: traefik-basic-auth
  tls:
    secretName: wildcard-tls-oisd

---
# Basic Auth middleware for Traefik dashboard
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-basic-auth
  namespace: traefik
spec:
  basicAuth:
    secret: traefik-auth-secret
