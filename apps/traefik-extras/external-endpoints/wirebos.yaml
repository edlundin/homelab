apiVersion: v1
kind: Service
metadata:
  name: nietzsche-wirebos-external
  namespace: traefik
spec:
  type: ExternalName
  externalName: wirebos.ison-mirfak.ts.net
  ports:
    - protocol: TCP
      port: 4000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: wirebos-ingress
  namespace: traefik
  annotations:
    gatus.home-operations.com/endpoint: |
      name: WireBOS
      group: Applications
      # The root path returns 404; a plain GET on /graphql returns 400.
      url: https://api.bos.oisd.dev/graphql
      method: POST
      headers:
        Content-Type: application/json
      body: '{"query":"{__typename}"}'
      conditions:
        - "[STATUS] == 200"
        - "[BODY].data.__typename == Query"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`api.bos.oisd.dev`)
      kind: Rule
      services:
        - name: nietzsche-wirebos-external
          port: 4000
          scheme: http
  tls:
    secretName: wildcard-tls-bos-oisd
