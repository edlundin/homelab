apiVersion: v1
kind: Service
metadata:
  name: actual-budget-cluster
  namespace: traefik
spec:
  type: ExternalName
  externalName: actual-budget.actual-budget.svc.cluster.local
  ports:
    - protocol: TCP
      port: 5006
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: actual-budget-ingress
  namespace: traefik
  annotations:
    gatus.home-operations.com/endpoint: |
      name: Actual Budget
      group: Applications
      conditions:
        - "[STATUS] == 200"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`budget.oisd.dev`) || Host(`budger.oisd.dev`)
      kind: Rule
      services:
        - name: actual-budget-cluster
          port: 5006
          scheme: http
  tls:
    secretName: wildcard-tls-oisd
