apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sure
  namespace: sure
  labels:
    app.kubernetes.io/name: sure
  annotations:
    gatus.home-operations.com/endpoint: |
      name: Sure
      group: Applications
      path: /up
      conditions:
        - "[STATUS] == 200"
spec:
  entryPoints: [websecure]
  routes:
    # Rails preloads 200 assets on the login page. Keep these public files out
    # of the dynamic route's rate-limit bucket while preserving secure headers.
    - match: Host(`sure.oisd.dev`) && (PathPrefix(`/assets/`) || Path(`/logo-pwa.png`))
      kind: Rule
      services:
        - name: sure
          port: 80
      middlewares:
        - name: secure-headers
          namespace: traefik
    - match: Host(`sure.oisd.dev`)
      kind: Rule
      services:
        - name: sure
          port: 80
      middlewares:
        - name: default-chain
          namespace: traefik
  tls:
    secretName: wildcard-tls-oisd
