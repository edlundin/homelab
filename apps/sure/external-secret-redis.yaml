apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: redis-secret-store
  namespace: sure
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  provider:
    kubernetes:
      remoteNamespace: redis
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: sure-external-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-redis-secrets-sure
  namespace: redis
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [redis-password]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sure-read-redis-secrets
  namespace: redis
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: sure-external-secrets
    namespace: sure
roleRef:
  kind: Role
  name: read-redis-secrets-sure
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sure-redis
  namespace: sure
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: redis-secret-store
    kind: SecretStore
  target:
    name: sure-redis
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # DB 0 is shared by WireBOS/SearxNG. Reserve DB 1 for Sure.
        REDIS_URL: "redis://:{{ .password | urlquery | replace \"+\" \"%20\" }}@redis-master.redis.svc.cluster.local:6379/1"
  data:
    - secretKey: password
      remoteRef:
        key: redis-password
        property: password
