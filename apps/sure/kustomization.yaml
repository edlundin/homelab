apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: sure
    repo: https://we-promise.github.io/sure
    version: 0.7.6
    releaseName: sure
    namespace: sure
    valuesFile: values.yaml
    skipTests: true
resources:
  - namespace.yaml
  - service-account.yaml
  - sure-secrets-sealed.yaml
  - postgres-sure-credentials-sealed.yaml
  - database-bootstrap-job.yaml
  - external-secret-postgres.yaml
  - external-secret-redis.yaml
  - external-secret-tls.yaml
  - pvc.yaml
  - ingress.yaml
  - tailscale-ingress.yaml
  - network-policy.yaml
patches:
  # The chart omits metadata.namespace even when Helm's namespace is set.
  - target:
      labelSelector: app.kubernetes.io/instance=sure
    patch: |-
      - op: add
        path: /metadata/namespace
        value: sure
  # Chart 0.7.6 does not expose serviceAccountName or worker probes as values.
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/name=sure
    patch: |-
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: sure
      - op: add
        path: /spec/template/spec/automountServiceAccountToken
        value: false
  - target:
      kind: Deployment
      name: sure-worker
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: sure-worker
      spec:
        template:
          spec:
            containers:
              - name: sidekiq
                # procps is included in the upstream image. Redis/DB failures
                # should not trigger restart loops: Sidekiq reconnects itself.
                startupProbe:
                  exec:
                    command: [pgrep, -f, "^sidekiq"]
                  periodSeconds: 5
                  failureThreshold: 30
                readinessProbe:
                  exec:
                    command: [pgrep, -f, "^sidekiq"]
                  periodSeconds: 10
                livenessProbe:
                  exec:
                    command: [pgrep, -f, "^sidekiq"]
                  initialDelaySeconds: 30
                  periodSeconds: 20
