apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: atuin-ai
  namespace: atuin
  labels:
    app.kubernetes.io/name: atuin
    app.kubernetes.io/component: ai-gateway
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`atuin-ai.oisd.dev`)
      kind: Rule
      services:
        - name: atuin-ai
          port: 8080
      middlewares:
        - name: default-chain
          namespace: traefik
  tls:
    secretName: wildcard-tls-oisd
