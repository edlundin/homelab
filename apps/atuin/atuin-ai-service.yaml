apiVersion: v1
kind: Service
metadata:
  name: atuin-ai
  namespace: atuin
  labels:
    app.kubernetes.io/name: atuin
    app.kubernetes.io/component: ai-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: atuin
    app.kubernetes.io/component: ai-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
