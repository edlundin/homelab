apiVersion: v1
kind: ConfigMap
metadata:
  name: atuin-ai
  namespace: atuin
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: atuin
    app.kubernetes.io/component: ai-gateway
data:
  config.toml: |
    port = 8080
    endpoint = "http://9router.9router.svc.cluster.local:20128/v1"
    default_model = "gpt-5.4-mini"

    [api_key]
    env = "CHAT_API_KEY"

    [[models]]
    alias = "gpt-5.4-mini"
    name = "GPT-5.4 Mini"
    description = "GPT-5.4 Mini through GitHub Copilot via 9router"
    model = "gh/gpt-5.4-mini"

    [request.body]
    stream_options = { include_usage = true }
