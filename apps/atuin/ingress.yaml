apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: atuin
  namespace: atuin
  annotations:
    gatus.home-operations.com/endpoint: |
      name: Atuin
      group: Applications
      path: /healthz
      conditions:
        - "[STATUS] == 200"
  labels:
    app.kubernetes.io/name: atuin
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`atuin.oisd.dev`)
      kind: Rule
      services:
        - name: atuin
          port: 8888
      middlewares:
        - name: default-chain
          namespace: traefik
  tls:
    secretName: wildcard-tls-oisd
