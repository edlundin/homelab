apiVersion: v1
kind: Service
metadata:
  name: cliproxyapi
  namespace: cliproxyapi
spec:
  selector:
    app.kubernetes.io/name: cliproxyapi
  ports:
    - name: redirect
      port: 8081
      targetPort: redirect
    - name: api
      port: 8317
      targetPort: api
    - name: dashboard
      port: 8080
      targetPort: dashboard
