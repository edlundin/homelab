apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cliproxyapi
  namespace: cliproxyapi
spec:
  entryPoints:
    - websecure
  routes:
    - match: (Host(`ai.oisd.dev`) || Host(`cpa.oisd.dev`)) && Path(`/`)
      kind: Rule
      services:
        - name: cliproxyapi
          port: 8081
      middlewares:
        - name: default-chain
          namespace: traefik
    - match: (Host(`ai.oisd.dev`) || Host(`cpa.oisd.dev`)) && (Path(`/omc`) || PathPrefix(`/omc/`))
      kind: Rule
      services:
        - name: cliproxyapi
          port: 8080
      middlewares:
        - name: default-chain
          namespace: traefik
    # Explicit inference paths only: never expose /v0/management or /v8/management.
    - match: Host(`ai.oisd.dev`) && (Path(`/v1`) || PathPrefix(`/v1/`) || Path(`/v1beta`) || PathPrefix(`/v1beta/`) || Path(`/backend-api/codex/responses`))
      kind: Rule
      services:
        - name: cliproxyapi
          port: 8317
      middlewares:
        - name: default-chain
          namespace: traefik
  tls:
    secretName: wildcard-tls-oisd
