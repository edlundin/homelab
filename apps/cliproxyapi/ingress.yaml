apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cliproxyapi
  namespace: cliproxyapi
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`ai.oisd.dev`) && (Path(`/omc`) || PathPrefix(`/omc/`))
      kind: Rule
      services:
        - name: cliproxyapi
          port: 8080
      middlewares:
        - name: default-chain
          namespace: traefik
    - match: Host(`ai.oisd.dev`)
      kind: Rule
      services:
        - name: cliproxyapi
          port: 8317
      middlewares:
        - name: default-chain
          namespace: traefik
  tls:
    secretName: wildcard-tls-oisd
