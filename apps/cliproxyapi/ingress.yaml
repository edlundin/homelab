apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cliproxyapi
  namespace: cliproxyapi
  annotations:
    gatus.home-operations.com/endpoint: |
      name: Oh My CPA
      group: AI & Automation
      path: /omc/api/healthz
      conditions:
        - "[STATUS] == 200"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`ai.oisd.dev`) && (Path(`/omc`) || PathPrefix(`/omc/`))
      kind: Rule
      services:
        - name: cliproxyapi
          port: 8080
      middlewares:
        - name: default-chain
          namespace: traefik
    # Management routes require CPA's management key; keep other paths restricted.
    - match: Host(`ai.oisd.dev`) && (Path(`/v0/management`) || PathPrefix(`/v0/management/`) || Path(`/v8/management`) || PathPrefix(`/v8/management/`))
      kind: Rule
      services:
        - name: cliproxyapi
          port: 8317
      middlewares:
        - name: default-chain
          namespace: traefik
    - match: Host(`ai.oisd.dev`) && (Path(`/v1`) || PathPrefix(`/v1/`) || Path(`/v1beta`) || PathPrefix(`/v1beta/`) || Path(`/backend-api/codex/responses`))
      kind: Rule
      services:
        - name: cliproxyapi
          port: 8317
      middlewares:
        - name: default-chain
          namespace: traefik
  tls:
    secretName: wildcard-tls-oisd
