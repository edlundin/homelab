apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cliproxyapi
  namespace: cliproxyapi
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`cpa.oisd.dev`) && (Path(`/omc`) || PathPrefix(`/omc/`))
      kind: Rule
      services:
        - name: cliproxyapi
          port: 8080
      middlewares:
        - name: default-chain
          namespace: traefik
    # Explicit inference paths only: never expose /v0/management or /v8/management.
    - match: Host(`ai.oisd.dev`) && (PathPrefix(`/v1/`) || PathPrefix(`/v1beta/`))
      kind: Rule
      services:
        - name: cliproxyapi
          port: 8317
      middlewares:
        - name: default-chain
          namespace: traefik
  tls:
    secretName: wildcard-tls-oisd
