apiVersion: v1
kind: ConfigMap
metadata:
  name: cliproxyapi-bootstrap
  namespace: cliproxyapi
data:
  redirect.conf: |
    server {
      listen 8081;
      server_name _;
      absolute_redirect off;
      location = / {
        if ($request_method = GET) { return 302 /omc/; }
        return 404;
      }
      location / { return 404; }
    }
  config.yaml: |
    config-version: 8
    server:
      host: ""
      port: 8317
    management:
      # MANAGEMENT_PASSWORD overrides this flag upstream. Ingress path allowlists
      # and NetworkPolicy are the external management boundary.
      allow-remote: false
      secret-key: ""
      disable-control-panel: true
    oauth:
      auth-dir: /data/auths
    observability:
      usage:
        usage-statistics-enabled: true
        redis-usage-queue-retention-seconds: 60
    plugins:
      enabled: false
      dir: /data/plugins
