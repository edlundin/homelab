apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cliproxyapi
  namespace: cliproxyapi
  labels:
    app.kubernetes.io/name: cliproxyapi
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cliproxyapi
                port:
                  number: 8081
          - path: /omc
            pathType: Prefix
            backend:
              service:
                name: cliproxyapi
                port:
                  number: 8080
  tls:
    - hosts:
        - cpa
---
# Explicit AI routes include management endpoints protected by CPA's management key.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cliproxyapi-ai
  namespace: cliproxyapi
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cliproxyapi
                port:
                  number: 8081
          - path: /omc
            pathType: Prefix
            backend:
              service:
                name: cliproxyapi
                port:
                  number: 8080
          - path: /v0/management
            pathType: Prefix
            backend:
              service:
                name: cliproxyapi
                port:
                  number: 8317
          - path: /v8/management
            pathType: Prefix
            backend:
              service:
                name: cliproxyapi
                port:
                  number: 8317
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: cliproxyapi
                port:
                  number: 8317
          - path: /v1beta
            pathType: Prefix
            backend:
              service:
                name: cliproxyapi
                port:
                  number: 8317
          - path: /backend-api/codex/responses
            pathType: Prefix
            backend:
              service:
                name: cliproxyapi
                port:
                  number: 8317
  tls:
    - hosts:
        - ai
