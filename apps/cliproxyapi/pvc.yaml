apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cliproxyapi-data-v2
  namespace: cliproxyapi
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      # Data is ~350 MB: config, auths, and the oh-my-cpa DB plus one
      # pre-migration backup of similar size.
      storage: 2Gi
