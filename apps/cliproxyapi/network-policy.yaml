apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cliproxyapi
  namespace: cliproxyapi
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cliproxyapi
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale-system
      ports:
        - protocol: TCP
          port: 8317
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Provider APIs, OAuth, model catalogs, and release checks use HTTPS.
    - ports:
        - protocol: TCP
          port: 443
