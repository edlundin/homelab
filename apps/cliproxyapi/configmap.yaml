apiVersion: v1
kind: ConfigMap
metadata:
  name: cliproxyapi-initial-config
  namespace: cliproxyapi
data:
  # Seeded once onto the PVC; subsequent edits belong to the dashboard.
  config.yaml: |
    config-version: 8
    server:
      host: ""
      port: 8317
      trusted-proxies: []
    oauth:
      auth-dir: /data/auths
    observability:
      usage:
        usage-statistics-enabled: true
        redis-usage-queue-retention-seconds: 60
    plugins:
      enabled: false
      dir: /data/plugins
