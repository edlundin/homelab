replicaCount: 1

fullnameOverride: pulse-chart

strategy:
  type: Recreate

image:
  pullPolicy: Always

persistence:
  enabled: true
  existingClaim: pulse-data

service:
  type: ClusterIP
  port: 7655

server:
  env:
    - name: FRONTEND_PORT
      value: "7655"
    - name: LOG_LEVEL
      value: "info"
    - name: DISCOVERY_SUBNET
      value: "192.168.2.0/24"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  livenessProbe:
    enabled: true
    path: /api/health
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
  readinessProbe:
    enabled: true
    path: /api/health
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 1
    failureThreshold: 3
