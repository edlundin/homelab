apiVersion: apps/v1
kind: Deployment
metadata:
  name: tandoor
  namespace: tandoor
  labels:
    app.kubernetes.io/name: tandoor
  annotations:
    homelab.oisd.io/root-container-justification: Tandoor starts its integrated nginx server on port 80 and adjusts media permissions during boot.
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tandoor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tandoor
    spec:
      serviceAccountName: tandoor
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: generate-credentials
          image: busybox:1.37.0
          command:
            - /bin/sh
            - -ec
            - |
              umask 077
              mkdir -p /data/media /data/secrets
              if [ ! -s /data/secrets/secret-key ]; then
                head -c 48 /dev/urandom | base64 | tr -d '\n' > /data/secrets/secret-key
              fi
              if [ ! -s /data/secrets/postgres-password ]; then
                head -c 32 /dev/urandom | base64 | tr -d '\n' > /data/secrets/postgres-password
              fi
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
        - name: initialize-database
          image: postgres:18.1-alpine
          command:
            - /bin/sh
            - -ec
            - |
              export PGPASSWORD="${POSTGRES_ADMIN_PASSWORD}"
              database_password="$(cat /data/secrets/postgres-password)"
              until pg_isready --host="${POSTGRES_HOST}" --port=5432 --username=postgres; do
                sleep 2
              done
              psql --host="${POSTGRES_HOST}" --username=postgres --dbname=postgres \
                --set=ON_ERROR_STOP=1 \
                --set=database_name=tandoor \
                --set=database_user=tandoor \
                --set=database_password="${database_password}" <<'SQL'
              SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'database_user', :'database_password')
              WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'database_user')\gexec
              SELECT format('ALTER ROLE %I PASSWORD %L', :'database_user', :'database_password')\gexec
              SELECT format('CREATE DATABASE %I OWNER %I', :'database_name', :'database_user')
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'database_name')\gexec
              SQL
          env:
            - name: POSTGRES_HOST
              value: postgres-postgresql.postgres.svc.cluster.local
            - name: POSTGRES_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tandoor-postgres-admin
                  key: password
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: tandoor
          image: vabene1111/recipes:2.6.13
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: TZ
              value: Europe/Paris
            - name: TANDOOR_PORT
              value: "80"
            - name: DB_ENGINE
              value: django.db.backends.postgresql
            - name: POSTGRES_HOST
              value: postgres-postgresql.postgres.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: tandoor
            - name: POSTGRES_USER
              value: tandoor
            - name: POSTGRES_PASSWORD_FILE
              value: /data/secrets/postgres-password
            - name: SECRET_KEY_FILE
              value: /data/secrets/secret-key
            - name: MEDIA_ROOT
              value: /data/media
            - name: ALLOWED_HOSTS
              value: tandoor.oisd.io,tandoor.ison-mirfak.ts.net
            - name: CSRF_TRUSTED_ORIGINS
              value: https://tandoor.oisd.io,https://tandoor.ison-mirfak.ts.net
            - name: ALLAUTH_TRUSTED_PROXY_COUNT
              value: "2"
          startupProbe:
            httpGet:
              path: /openapi
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /openapi
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /openapi
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tandoor-data
