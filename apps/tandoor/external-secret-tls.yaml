apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: traefik-secret-store
  namespace: tandoor
spec:
  provider:
    kubernetes:
      remoteNamespace: traefik
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: tandoor-traefik-external-secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tandoor-traefik-external-secrets
  namespace: tandoor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-traefik-tls-for-tandoor
  namespace: traefik
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["wildcard-tls-oisd"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tandoor-read-traefik-tls
  namespace: traefik
subjects:
  - kind: ServiceAccount
    name: tandoor-traefik-external-secrets
    namespace: tandoor
roleRef:
  kind: Role
  name: read-traefik-tls-for-tandoor
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wildcard-tls-oisd
  namespace: tandoor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: traefik-secret-store
    kind: SecretStore
  target:
    name: wildcard-tls-oisd
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: wildcard-tls-oisd
        property: tls.crt
    - secretKey: tls.key
      remoteRef:
        key: wildcard-tls-oisd
        property: tls.key
