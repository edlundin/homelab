apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: body-limit
  namespace: plane
spec:
  buffering:
    # Matches FILE_SIZE_LIMIT in plane-doc-store (plane-secrets-sealed.yaml).
    maxRequestBodyBytes: 20971520
---
# Mirrors the chart's Traefik routes (disabled in values.yaml) and adds the shared
# middleware chain and wildcard certificate. Specific paths come before the web catch-all.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: plane
  namespace: plane
  labels:
    app.kubernetes.io/name: plane
  annotations:
    gatus.home-operations.com/endpoint: |
      name: Plane
      group: Applications
      path: /api/instances/
      conditions:
        - "[STATUS] == 200"
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`ticket.oisd.dev`) && PathPrefix(`/spaces`)
      kind: Rule
      services:
        - name: plane-space
          port: 3000
      middlewares: &middlewares
        - name: default-chain
          namespace: traefik
        - name: body-limit
    - match: Host(`ticket.oisd.dev`) && PathPrefix(`/god-mode`)
      kind: Rule
      services:
        - name: plane-admin
          port: 3000
      middlewares: *middlewares
    - match: Host(`ticket.oisd.dev`) && (PathPrefix(`/api`) || PathPrefix(`/auth`) || PathPrefix(`/static/`))
      kind: Rule
      services:
        - name: plane-api
          port: 8000
      middlewares: *middlewares
    # Collaborative editing websocket.
    - match: Host(`ticket.oisd.dev`) && PathPrefix(`/live`)
      kind: Rule
      services:
        - name: plane-live
          port: 3000
      middlewares: *middlewares
    # Uploaded assets, served by MinIO from the `uploads` bucket (AWS_S3_BUCKET_NAME).
    # The chart's `download` bucket policy also grants anonymous ListBucket, and S3
    # lists at the bucket root. Route only object keys, plus the presigned POST that
    # browser uploads send to the root; other root requests fall through to web.
    - match: Host(`ticket.oisd.dev`) && (PathRegexp(`^/uploads/.+`) || ((Path(`/uploads`) || Path(`/uploads/`)) && Method(`POST`)))
      kind: Rule
      services:
        - name: plane-minio
          port: 9000
      middlewares: *middlewares
    - match: Host(`ticket.oisd.dev`)
      kind: Rule
      services:
        - name: plane-web
          port: 3000
      middlewares: *middlewares
  tls:
    secretName: wildcard-tls-oisd
