---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    # Before the wave -1 database bootstrap Job and the app workloads.
    argocd.argoproj.io/sync-wave: "-2"
  name: plane
  namespace: plane
spec:
  encryptedData:
    AMQP_URL: 
    DATABASE_URL: 
    LIVE_SERVER_SECRET_KEY: 
    REDIS_URL: 
    SECRET_KEY: 
  template:
    metadata:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
      name: plane
      namespace: plane
---
apiVersion: bitnami.com/v1alpha1
