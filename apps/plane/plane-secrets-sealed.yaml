  annotations:
    # Before the wave -1 database bootstrap Job and the app workloads.
    argocd.argoproj.io/sync-wave: "-2"
  name: plane-doc-store
  namespace: plane
spec:
  encryptedData:
    AWS_ACCESS_KEY_ID: 
    AWS_S3_BUCKET_NAME: 
    AWS_S3_ENDPOINT_URL: 
    AWS_SECRET_ACCESS_KEY: 
    FILE_SIZE_LIMIT: 
    MINIO_ROOT_PASSWORD: 
    MINIO_ROOT_USER: 
