apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: plane-ce
    repo: https://helm.plane.so/
    version: 1.9.2
    releaseName: plane
    namespace: plane
    valuesFile: values.yaml
resources:
  - namespace.yaml
  - service-account.yaml
  - plane-secrets-sealed.yaml
  - postgres-plane-credentials-sealed.yaml
  - database-bootstrap-job.yaml
  - external-secret-tls.yaml
  - ingress.yaml
  - network-policy.yaml
patches:
  # `helm template` always renders Release.Revision 1, so the Job names never
  # change while their pod templates (image tags) do. Recreate them instead of
  # failing on the immutable template; both Jobs are idempotent.
  - target:
      kind: Job
      labelSelector: app.kubernetes.io/instance=plane
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-options: Force=true,Replace=true
  # The chart leaves the bucket Job's pod unlabelled, so the namespace
  # NetworkPolicies would isolate it from DNS and MinIO.
  - target:
      kind: Job
      name: plane-minio-bucket-1
    patch: |-
      - op: add
        path: /spec/template/metadata/labels
        value:
          app.kubernetes.io/instance: plane
          app.kubernetes.io/component: minio-bucket
  # The upstream images run as root and the chart exposes no securityContext.
  # Restrict root without changing the user, which the images do not support.
  - target:
      kind: (Deployment|StatefulSet|Job)
      labelSelector: app.kubernetes.io/instance=plane
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext
        value:
          seccompProfile:
            type: RuntimeDefault
      - op: add
        path: /spec/template/spec/automountServiceAccountToken
        value: false
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
