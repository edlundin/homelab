apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: qbittorrent
  labels:
    app.kubernetes.io/name: qbittorrent
  annotations:
    homelab.oisd.dev/storage-basis: Existing /config state is 77Mi; /downloads is the existing RAID 5 torrent directory exported by Sarasate over NFS.
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent
    spec:
      serviceAccountName: qbittorrent
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: sarasate
      initContainers:
        - name: vuetorrent
          image: docker.io/linuxserver/qbittorrent@sha256:b522f9f4b769f8f36d49d22d5eb6a92e9aa18904c6a1830b1439df511ec21983
          command:
            - sh
            - -ec
            - |
              release=v2.36.1
              digest=70b67531f0f3bc36c8bd05d82cc7ba1ee37c71c17f0b6c45f522200e35e66f37
              target="/config/qBittorrent/vuetorrent-upstream-${release}"
              if [ -f "$target/public/index.html" ] && [ "$(cat "$target/.release-sha256" 2>/dev/null)" = "$digest" ]; then
                exit 0
              fi
              staging=$(mktemp -d /config/qBittorrent/.vuetorrent.XXXXXX)
              trap 'rm -rf "$staging"' EXIT
              curl -fsSL --retry 2 --max-time 60 \
                -o "$staging/vuetorrent.zip" \
                "https://github.com/VueTorrent/VueTorrent/releases/download/${release}/vuetorrent.zip"
              printf '%s  %s\n' "$digest" "$staging/vuetorrent.zip" | sha256sum -c -
              unzip -q "$staging/vuetorrent.zip" -d "$staging"
              test -f "$staging/vuetorrent/public/index.html"
              printf '%s\n' "$digest" > "$staging/vuetorrent/.release-sha256"
              rm "$staging/vuetorrent.zip"
              rm -rf "$target"
              mv "$staging/vuetorrent" "$target"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: raid
              mountPath: /config
              subPath: qbittorrent/config
      containers:
        - name: qbittorrent
          image: docker.io/linuxserver/qbittorrent@sha256:b522f9f4b769f8f36d49d22d5eb6a92e9aa18904c6a1830b1439df511ec21983
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Europe/Paris
            - name: WEBUI_PORT
              value: "8080"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK
              value: "007"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: peer-tcp
              containerPort: 6881
              hostPort: 6881
              protocol: TCP
            - name: peer-udp
              containerPort: 6881
              hostPort: 6881
              protocol: UDP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          volumeMounts:
            - name: raid
              mountPath: /config
              subPath: qbittorrent/config
            - name: raid
              mountPath: /downloads
              subPath: torrent
      volumes:
        - name: raid
          nfs:
            server: 192.168.2.1
            path: /srv/nfs/raid
