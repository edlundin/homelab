apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    # Required by Argo CD's settings informer, not just descriptive metadata.
    app.kubernetes.io/part-of: argocd
  annotations:
    # Do not delete the installation's shared ConfigMap when pruning extras.
    argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=false
data:
  kustomize.buildOptions: --enable-helm
