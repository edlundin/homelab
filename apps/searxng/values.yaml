## Values for TrueCharts searxng chart
# TrueCharts expects app-specific values under workload.main, not top-level env.
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            BASE_URL: "https://search.oisd.dev"
            # Protect upstream engines from abusive or automated clients.
            SEARXNG_LIMITER: "true"
            SEARXNG_VALKEY_URL:
              valueFrom:
                secretKeyRef:
                  name: searxng-redis
                  key: redis_url
          # kubectl top measured 176Mi and 1m CPU; 256Mi and 10m cover the pod.
          resources:
            requests:
              cpu: 10m
              memory: 256Mi
# Use the existing Redis deployment as SearXNG's Valkey-compatible limiter backend.
cnpg:
  redis:
    enabled: false
redis:
  enabled: false
# Ingress (optional)
ingress:
  main:
    enabled: true
    hosts:
    - host: search.oisd.dev
      paths:
      - path: /
        pathType: Prefix
secret:
  searxng-config:
    enabled: false
persistence:
  config:
    enabled: true
    type: secret
    objectName: searxng-config
    mountPath: /etc/searxng
image:
  tag: latest@sha256:4f392d131c301e426f27091545214d98e4c8d24c4b638f2e53736cca3d30e8c9
  repository: docker.io/searxng/searxng
