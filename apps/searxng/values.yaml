## Values for TrueCharts searxng chart
# TrueCharts expects app-specific values under workload.main, not top-level env.
workload:
  main:
    replicas: 2
    strategy: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    podSpec:
      containers:
        main:
          env:
            BASE_URL: "https://search.oisd.dev"
            # Protect upstream engines from abusive or automated clients.
            SEARXNG_LIMITER: "true"
            SEARXNG_VALKEY_URL:
              secretKeyRef:
                name: searxng-redis
                key: redis_url
                expandObjectName: false
          # kubectl top measured 176Mi and 1m CPU; 256Mi and 10m cover the pod.
          resources:
            requests:
              cpu: 10m
              memory: 256Mi

# Keep application replicas on separate physical servers.
podOptions:
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      # Count each rollout separately so removing old pods preserves the spread.
      matchLabelKeys:
        - pod-template-hash
      labelSelector:
        matchLabels:
          app.kubernetes.io/instance: searxng
          pod.name: main

podDisruptionBudget:
  main:
    enabled: true
    minAvailable: 1
    targetSelector: main
# Use the existing Redis deployment as SearXNG's Valkey-compatible limiter backend.
cnpg:
  redis:
    enabled: false
redis:
  enabled: false
# Ingress (optional)
ingress:
  main:
    enabled: true
    hosts:
    - host: search.oisd.dev
      paths:
      - path: /
        pathType: Prefix
secret:
  searxng-config:
    enabled: false
persistence:
  config:
    enabled: true
    type: secret
    objectName: searxng-config
    mountPath: /etc/searxng
image:
  tag: latest@sha256:76b0bf285aca014c7191fc4d9234c4bfb358624ac33d8883833d496c059ec072
  repository: docker.io/searxng/searxng
