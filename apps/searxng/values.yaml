## Values for TrueCharts searxng chart
# TrueCharts expects app-specific values under workload.main, not top-level env.
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            BASE_URL: "https://search.oisd.io"
          # kubectl top measured 176Mi and 1m CPU; 256Mi and 10m cover the pod.
          resources:
            requests:
              cpu: 10m
              memory: 256Mi
# Disable Redis entirely for initial deployment
cnpg:
  redis:
    enabled: false
redis:
  enabled: false
# Ingress (optional)
ingress:
  main:
    enabled: true
    hosts:
    - host: search.oisd.io
      paths:
      - path: /
        pathType: Prefix
secret:
  searxng-config:
    enabled: false
persistence:
  config:
    enabled: true
    type: secret
    objectName: searxng-config
    mountPath: /etc/searxng
image:
  tag: latest@sha256:b36af7984b87191b595bc5301418ed6432c047668a4547ab531a7439b816fac3
  repository: docker.io/searxng/searxng
