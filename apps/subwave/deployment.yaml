apiVersion: apps/v1
kind: Deployment
metadata:
  name: subwave
  namespace: subwave
  labels:
    app.kubernetes.io/name: subwave
  annotations:
    homelab.oisd.io/root-container-justification: SUB/WAVE controller reads root-only Icecast secrets; broadcast renders Icecast configuration with DAC_OVERRIDE, then drops to its bundled user.
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: subwave
  template:
    metadata:
      labels:
        app.kubernetes.io/name: subwave
      annotations:
        homelab.oisd.io/analyzer-request-basis: The heavy analyzer used its full one-core limit during the audio backfill, so it reserves one CPU.
        homelab.oisd.io/analyzer-limit-basis: Four CPUs let CLAP and Demucs use the node's measured spare capacity without consuming all eight allocatable CPUs; 6Gi remains above the observed 2362Mi memory use.
        homelab.oisd.io/analyzer-timeout-basis: The requested 10800000ms three-hour tripwire replaces the 600000ms deadline that interrupted heavy fingerprinting; completed CPU analysis was measured at 7m20s.
    spec:
      serviceAccountName: subwave
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: generate-admin-credentials
          image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - >-
              umask 077;
              mkdir -p /var/sub-wave;
              chmod 0777 /var/sub-wave;
              touch /var/sub-wave/secrets.env;
              if ! grep -Eq '^ADMIN_USER=.+$' /var/sub-wave/secrets.env; then
                printf 'ADMIN_USER=admin\n' >> /var/sub-wave/secrets.env;
              fi;
              if ! grep -Eq '^ADMIN_PASS=.+$' /var/sub-wave/secrets.env; then
                printf 'ADMIN_PASS=' >> /var/sub-wave/secrets.env;
                tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 32 >> /var/sub-wave/secrets.env;
                printf '\n' >> /var/sub-wave/secrets.env;
              fi;
              chmod 600 /var/sub-wave/secrets.env
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: state
              mountPath: /var/sub-wave
      containers:
        - name: caddy
          image: ghcr.io/perminder-klair/subwave-caddy:1.8.0@sha256:c9c7963523d1708d0013af9e6414bd601083fc763de7d383ae919fca797f40d0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              add: [NET_BIND_SERVICE]
              drop: [ALL]
        - name: web
          image: ghcr.io/perminder-klair/subwave-web:1.8.0@sha256:eccd43a8059caa98e560c96b996781d4c6f6de279b1638e4b30079b2681daf7c
          imagePullPolicy: IfNotPresent
          ports:
            - name: web
              containerPort: 7700
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: SITE_URL
              value: https://wave.ison-mirfak.ts.net
            - name: CONTROLLER_INTERNAL_URL
              value: http://controller:7701
          startupProbe:
            httpGet:
              path: /
              port: web
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: web
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: web
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
        - name: controller
          image: ghcr.io/perminder-klair/subwave-controller:1.8.0@sha256:2bf155e5e0deea9d26ae52c0efd3753c4fcf3482398e77879a1a23445efe1694
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - >-
              set -a;
              . /var/sub-wave/secrets.env;
              set +a;
              exec node_modules/.bin/tsx src/server.ts
          ports:
            - name: controller
              containerPort: 7701
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: TZ
              value: Europe/Paris
            - name: STATE_DIR
              value: /var/sub-wave
            - name: SOUNDS_DIR
              value: /sounds
            - name: ANALYZE_URL
              value: http://analyzer:8080
            - name: ANALYZE_REQUEST_TIMEOUT_MS
              value: "10800000"
            - name: ICECAST_STATUS_URL
              value: http://broadcast:7702/status-json.xsl
            - name: ICECAST_ADMIN_URL
              value: http://broadcast:7702/admin/listclients
          startupProbe:
            httpGet:
              path: /health
              port: controller
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: controller
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: controller
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: state
              mountPath: /var/sub-wave
        - name: broadcast
          image: ghcr.io/perminder-klair/subwave-broadcast:1.8.0@sha256:ce1a8779b191630b7803e5094f0498ada49dd3f66d85782aa9d4a3abd8b5501f
          imagePullPolicy: IfNotPresent
          ports:
            - name: broadcast
              containerPort: 7702
              protocol: TCP
            - name: liquidsoap
              containerPort: 1234
              protocol: TCP
          env:
            - name: TZ
              value: Europe/Paris
          startupProbe:
            httpGet:
              path: /status-json.xsl
              port: broadcast
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /status-json.xsl
              port: broadcast
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /status-json.xsl
              port: broadcast
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              add: [CHOWN, DAC_OVERRIDE, KILL, SETGID, SETUID]
              drop: [ALL]
          volumeMounts:
            - name: state
              mountPath: /var/sub-wave
        - name: analyzer
          image: ghcr.io/perminder-klair/subwave-analyzer:1.8.0@sha256:6d86291c3ac9260780b52d1834bd16b784507570dfcfc57166a4bdf9988b531b
          imagePullPolicy: IfNotPresent
          ports:
            - name: analyzer
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: analyzer
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: analyzer
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: analyzer
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 1000m
              memory: 1Gi
            limits:
              cpu: 4000m
              memory: 6Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: state
              mountPath: /var/sub-wave
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: subwave-state-v2
