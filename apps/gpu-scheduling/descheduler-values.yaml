kind: CronJob
deschedulerPolicy:
  # Worker request allocation measured on 2026-08-20: 610n1r0 30% CPU/21% memory,
  # k3s-agent-1 23%/18%, and k3s-agent-2 61%/60%. These cut-offs identify the
  # measured low and high workers while leaving control-plane taints unchanged.
  maxNoOfPodsToEvictPerNode: 1
  profiles:
    - name: worker-request-balance
      pluginConfig:
        - name: DefaultEvictor
          args:
            nodeFit: true
            podProtections:
              extraEnabled: []
        - name: LowNodeUtilization
          args:
            thresholds:
              cpu: 30
              memory: 21
            targetThresholds:
              cpu: 60
              memory: 60
      plugins:
        balance:
          enabled:
            - LowNodeUtilization
