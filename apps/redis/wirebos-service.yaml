apiVersion: v1
kind: Service
metadata:
  name: wirebos-redis
  namespace: redis
  annotations:
    tailscale.com/hostname: wirebos-redis
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    app.kubernetes.io/component: master
    app.kubernetes.io/instance: redis
    app.kubernetes.io/name: redis
