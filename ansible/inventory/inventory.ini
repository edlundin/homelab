wirebos ansible_host=wirebos ansible_user=root vmid=141
spinoza ansible_host=192.168.2.104 ansible_user=root vmid=104
sarasate ansible_host=sarasate ansible_user=eighth ansible_port=46842
peirce ansible_host=peirce ansible_user=ubuntu
seneca ansible_host=seneca ansible_user=ubuntu
soteria ansible_host=soteria ansible_user=ubuntu

[proxmox_nodes]
nietzsche

